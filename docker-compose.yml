version: '3.8'
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: b2b_workflow
      POSTGRES_USER: workflow_user
      POSTGRES_PASSWORD: workflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:20.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    command: start-dev
    depends_on:
      - postgres

  workflow-backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: workflow_user
      DB_PASSWORD: workflow_password
      REDIS_HOST: redis
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - redis
      - minio
      - keycloak
    volumes:
      - ./logs:/app/logs

  workflow-frontend:
    build: ./frontend
    environment:
      REACT_APP_API_URL: http://localhost:8081/api
    ports:
      - "3000:3000"
    depends_on:
      - workflow-backend

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - workflow-frontend
      - workflow-backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
