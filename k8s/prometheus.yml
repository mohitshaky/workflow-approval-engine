global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'workflow-backend'
    static_configs:
      - targets: ['workflow-backend:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']